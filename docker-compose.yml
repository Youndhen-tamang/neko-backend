services:
  postgres:
    image: postgres:16-alpine
    container_name: cs-ecommerce-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - cs_pg_data:/var/lib/postgresql/data

volumes:
  cs_pg_data:
